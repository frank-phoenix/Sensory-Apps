<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sensory Circuit Minigames</title>
<!--
  STAFF NOTES
  -----------
  One file, works fully offline, no installs. Open in any browser, fullscreen recommended.
  Controls that all work at once, so any student can use whichever they can manage:
    - Touch / mouse tap or drag  -> always the main way to play
    - Caps Lock key press        -> acts as a single big "do the action" button in every game
    - Arrow keys                 -> move things left/right (Catch), cycle a choice (Match It)
    - On-screen arrow buttons    -> shown during the Catch game, for drag-free left/right control
  Every game is endless/replayable and never "fails" the student - misses are just ignored gently.
  A tick badge appears on a game's icon on the home screen once it has been played to a finish.
  Small trophy button appears on the home screen once all 5 have been played - a bigger celebration
  for the end of a circuit. A small reset icon (top right of home screen) clears the ticks for the
  next student.
-->
<style>
  :root{
    --bg-deep:#0F1330;
    --bg-mid:#1B2147;
    --panel: rgba(15,19,48,0.42);
    --teal:#4FD1C5;
    --coral:#FF7A85;
    --gold:#FFC857;
    --violet:#9B8CFF;
    --green:#7FE0A0;
    --text:#F5F7FF;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg-deep); color:var(--text);
    font-family:'Baloo 2','Quicksand','Trebuchet MS',system-ui,sans-serif;
    user-select:none; touch-action:none;
  }
  #gameCanvas{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ---------- HUD (visible only during a game) ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0; display:none; align-items:center; gap:14px;
    padding:16px 18px; z-index:4; pointer-events:none;
  }
  body.in-game #hud{ display:flex; }
  #homeBtnTop{
    pointer-events:auto;
    width:58px; height:58px; border-radius:20px; border:none;
    background:rgba(255,255,255,0.14); color:var(--text); font-size:26px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  #starRow{ display:flex; gap:4px; flex-wrap:wrap; max-width:60%; }
  .hudStar{ font-size:20px; color:rgba(255,255,255,0.22); text-shadow:none; }
  .hudStar.filled{ color:var(--gold); text-shadow:0 0 10px rgba(255,200,87,0.85); }

  /* ---------- Home screen ---------- */
  #homeScreen{
    position:fixed; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px;
    background:var(--panel);
  }
  #homeTitle{
    font-size:15px; letter-spacing:0.5px; opacity:0.55; text-align:center;
  }
  #homeGrid{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:28px; max-width:1000px; padding:0 20px;
  }
  .gameTile{
    position:relative; width:190px; height:190px; border:none; border-radius:42px;
    background:linear-gradient(160deg, var(--tile-color), rgba(255,255,255,0.05));
    box-shadow:0 10px 30px rgba(0,0,0,0.35), 0 0 0 0 rgba(255,255,255,0);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; transition:transform .15s ease;
  }
  .gameTile:active{ transform:scale(0.93); }
  .gameTile.selected{ box-shadow:0 10px 30px rgba(0,0,0,0.35), 0 0 0 6px #fff; }
  .tileIcon{ font-size:74px; line-height:1; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.35)); }
  .tileLabel{ font-size:15px; opacity:0.85; }
  .badge{
    position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%;
    background:var(--green); color:#0F1330; font-size:18px; font-weight:bold;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.3);
  }
  #finaleBtn{
    display:none; align-items:center; gap:10px; border:none; border-radius:30px;
    padding:16px 30px; font-size:20px; background:linear-gradient(160deg,var(--gold),#ffdf94);
    color:#3a2c00; cursor:pointer; box-shadow:0 8px 24px rgba(255,200,87,0.4);
  }
  #finaleBtn span.icon{ font-size:28px; }
  #resetBtn{
    position:fixed; top:18px; right:18px; z-index:6; width:46px; height:46px; border-radius:16px;
    border:none; background:rgba(255,255,255,0.12); color:var(--text); font-size:20px; opacity:0.55;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  /* ---------- Catch game on-screen arrows ---------- */
  #catcherControls{
    position:fixed; bottom:26px; left:0; right:0; display:none; justify-content:space-between;
    padding:0 26px; z-index:4; pointer-events:none;
  }
  .arrowBtn{
    pointer-events:auto; width:96px; height:96px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.16); color:var(--text); font-size:40px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,0.3);
  }
  .arrowBtn:active{ background:rgba(255,255,255,0.32); }

  /* ---------- Celebration overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:10; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:34px;
    background:rgba(10,13,32,0.72); backdrop-filter:blur(2px);
  }
  .overlay.show{ display:flex; }
  .bigEmoji{ font-size:150px; }
  .bounce{ animation:bounceIn .7s ease; }
  @keyframes bounceIn{
    0%{ transform:scale(0.3) rotate(-8deg); opacity:0; }
    55%{ transform:scale(1.18) rotate(4deg); opacity:1; }
    75%{ transform:scale(0.94) rotate(-2deg); }
    100%{ transform:scale(1) rotate(0); }
  }
  .overlayBtns{ display:flex; gap:26px; }
  .roundBtn{
    width:118px; height:118px; border-radius:50%; border:none; font-size:46px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 10px 26px rgba(0,0,0,0.4);
  }
  .roundBtn.play{ background:linear-gradient(160deg,var(--teal),#8fe9df); color:#04302c; }
  .roundBtn.home{ background:linear-gradient(160deg,var(--coral),#ffb3ba); color:#4a0f13; }
  .roundBtn.more{ background:linear-gradient(160deg,var(--violet),#cfc6ff); color:#241a4d; }
  .roundBtn.newstudent{ background:linear-gradient(160deg,var(--gold),#ffe9b8); color:#3a2c00; }
  .roundBtn:active{ transform:scale(0.92); }

  @media (prefers-reduced-motion: reduce){
    .bounce{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <button id="homeBtnTop" aria-label="Home">🏠</button>
  <div id="starRow"></div>
</div>

<div id="catcherControls">
  <button class="arrowBtn" id="leftBtn">◀</button>
  <button class="arrowBtn" id="rightBtn">▶</button>
</div>

<div id="homeScreen">
  <div id="homeTitle">Sensory Circuit &nbsp;·&nbsp; tap a game to start</div>
  <div id="homeGrid"></div>
  <button id="finaleBtn"><span class="icon">🏆</span> All 5 played!</button>
</div>
<button id="resetBtn" title="Reset for next student">↺</button>

<div class="overlay" id="celebrateOverlay">
  <div class="bigEmoji" id="celebrateEmoji">🎉</div>
  <div class="overlayBtns">
    <button class="roundBtn play" id="playAgainBtn" aria-label="Play again">↻</button>
    <button class="roundBtn home" id="celHomeBtn" aria-label="Home">🏠</button>
  </div>
</div>

<div class="overlay" id="finaleOverlay">
  <div class="bigEmoji" id="finaleEmoji">🏆</div>
  <div class="overlayBtns">
    <button class="roundBtn more" id="finaleMoreBtn" aria-label="Keep playing">🔁</button>
    <button class="roundBtn newstudent" id="finaleNewBtn" aria-label="Next student">🙂</button>
  </div>
</div>

<script>
/* ================== helpers ================== */
function rand(min,max){ return Math.random()*(max-min)+min; }
function clamp(v,min,max){ return Math.min(max,Math.max(min,v)); }
function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }
function pick(arr){ return arr[Math.floor(rand(0,arr.length))]; }
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand(0,i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function easeIn(t){ t=clamp(t,0,1); return t*t; }
function shade(hex, amt){
  const c = hex.replace('#','');
  const num = parseInt(c,16);
  let r=(num>>16)+amt, g=((num>>8)&0xff)+amt, b=(num&0xff)+amt;
  r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
  return 'rgb('+r+','+g+','+b+')';
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawStarShape(ctx,cx,cy,r,color){
  ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang = Math.PI/5*i - Math.PI/2;
    const rad = i%2===0? r : r*0.45;
    ctx.lineTo(cx+Math.cos(ang)*rad, cy+Math.sin(ang)*rad);
  }
  ctx.closePath(); ctx.fill();
}
const PALETTE = ['#4FD1C5','#FF7A85','#FFC857','#9B8CFF','#7FE0A0'];

/* ================== canvas / sizing ================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  initStars();
}
window.addEventListener('resize', resize);

/* starfield ambient background */
let stars=[];
function initStars(){
  stars=[];
  for(let i=0;i<80;i++) stars.push({x:rand(0,W), y:rand(0,H), r:rand(0.6,2.2), phase:rand(0,Math.PI*2)});
}
function drawBackground(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0F1330'); g.addColorStop(1,'#1B2147');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{
    ctx.globalAlpha = 0.35+0.35*Math.sin(t*0.0011+s.phase);
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

/* ================== audio ================== */
let audioCtx=null;
function ensureAudio(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,dur,type,vol,startDelay,freqEnd){
  ensureAudio();
  dur = dur||0.15; type=type||'sine'; vol=vol||0.22; startDelay=startDelay||0;
  const t0 = audioCtx.currentTime + startDelay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0+dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxPop(){ tone(rand(500,650),0.14,'sine',0.25,0,rand(200,260)); }
function sfxChime(){ tone(784,0.12,'triangle',0.2,0); tone(988,0.16,'triangle',0.22,0.08); }
function sfxTry(){ tone(220,0.18,'sine',0.14,0); }
function sfxFanfare(){
  [523,659,784,1047].forEach((f,i)=>tone(f,0.22,'triangle',0.22,i*0.11));
  tone(1319,0.4,'triangle',0.2,0.44);
}
function sfxWhoosh(){
  ensureAudio();
  const t0=audioCtx.currentTime;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(120,t0);
  osc.frequency.exponentialRampToValueAtTime(900,t0+0.6);
  gain.gain.setValueAtTime(0.22,t0);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+0.6);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+0.65);
}

/* ================== particles ================== */
let particles=[];
function spawnBurst(x,y,color,count){
  count = count||16;
  for(let i=0;i<count;i++){
    const ang=rand(0,Math.PI*2), spd=rand(60,220);
    particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:0,maxLife:rand(0.5,0.9),color,size:rand(3,7),grav:120});
  }
}
let confetti=[];
function spawnConfetti(count){
  count = count||120;
  for(let i=0;i<count;i++){
    confetti.push({x:rand(0,W), y:rand(-H,0), vx:rand(-40,40), vy:rand(120,260), rot:rand(0,Math.PI*2), vr:rand(-4,4), color:pick(PALETTE), size:rand(6,12), life:0, maxLife:rand(3,5)});
  }
}
function updateParticles(dt){
  particles.forEach(p=>{ p.life+=dt; p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; });
  particles = particles.filter(p=>p.life<p.maxLife);
  confetti.forEach(p=>{ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; });
  confetti = confetti.filter(p=>p.life<p.maxLife && p.y<H+40);
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha = Math.max(1-p.life/p.maxLife,0);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
  confetti.forEach(p=>{
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.color;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();
  });
}

/* ================== HUD ================== */
const starRowEl = document.getElementById('starRow');
function updateHUD(count,target){
  starRowEl.innerHTML='';
  for(let i=0;i<target;i++){
    const span=document.createElement('span');
    span.className = 'hudStar'+(i<count?' filled':'');
    span.textContent='★';
    starRowEl.appendChild(span);
  }
}

/* ================== Game 1: Bubble Pop ================== */
function createBubbleGame(){
  const target=12; let success=0; let bubbles=[]; let spawnTimer=0;
  function spawn(){
    const r=rand(55,85);
    bubbles.push({x:rand(r,W-r), y:H+r, r, vy:-rand(50,90), phase:rand(0,10), color:pick(PALETTE)});
  }
  function pop(b,i){
    spawnBurst(b.x,b.y,b.color,20); sfxPop();
    bubbles.splice(i,1); success++; updateHUD(success,target);
    if(success>=target) setTimeout(()=>celebrate('bubble'),150);
  }
  return {
    name:'bubble', targetCount:target,
    init(){ bubbles=[]; spawnTimer=0; success=0; updateHUD(0,target); },
    update(dt){
      spawnTimer -= dt;
      if(spawnTimer<=0 && bubbles.length<7){ spawn(); spawnTimer=rand(0.55,0.9); }
      bubbles.forEach(b=>{ b.phase+=dt*2; b.x += Math.sin(b.phase)*0.6; b.y += b.vy*dt; });
      bubbles = bubbles.filter(b=> b.y+b.r > -20);
    },
    draw(){
      const highlight = bubbles[0];
      bubbles.forEach(b=>{
        ctx.save();
        ctx.shadowColor=b.color; ctx.shadowBlur=30;
        const grad=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.1,b.x,b.y,b.r);
        grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.25,b.color); grad.addColorStop(1,shade(b.color,-40));
        ctx.fillStyle=grad; ctx.globalAlpha=0.92;
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
        if(b===highlight){
          ctx.globalAlpha = 0.55+0.35*Math.sin(performance.now()*0.006);
          ctx.lineWidth=4; ctx.strokeStyle='#ffffff';
          ctx.beginPath(); ctx.arc(b.x,b.y,b.r+9,0,Math.PI*2); ctx.stroke();
        }
        ctx.restore();
      });
    },
    onPointerDown(x,y){
      for(let i=bubbles.length-1;i>=0;i--){
        const b=bubbles[i];
        if(dist(x,y,b.x,b.y) <= b.r*1.15){ pop(b,i); break; }
      }
    },
    onCapsLock(){ if(bubbles.length) pop(bubbles[0],0); }
  };
}

/* ================== Game 2: Match It (color matching) ================== */
function createMatchGame(){
  const target=8; let success=0; let targetColor=null, buttons=[], selIndex=1, wobble=null, roundLocked=false;
  function newRound(){
    const shuffled = shuffleArr([...PALETTE]);
    targetColor = shuffled[0];
    const opts = shuffleArr([shuffled[0], shuffled[1], shuffled[2]]);
    const spacing = Math.min(230, (W-160)/3);
    const startX = W/2 - spacing;
    buttons = opts.map((c,i)=>({x:startX+i*spacing, y:H*0.68, r:80, color:c}));
    selIndex=1; roundLocked=false;
  }
  function choose(i){
    if(roundLocked) return;
    const b=buttons[i];
    if(b.color===targetColor){
      roundLocked=true;
      spawnBurst(b.x,b.y,b.color,24); spawnBurst(W/2,H*0.28,targetColor,24);
      sfxChime(); success++; updateHUD(success,target);
      if(success>=target){ setTimeout(()=>celebrate('match'),400); }
      else setTimeout(newRound,700);
    } else { wobble={index:i,t:0}; sfxTry(); }
  }
  return {
    name:'match', targetCount:target,
    init(){ success=0; updateHUD(0,target); newRound(); },
    update(dt){ if(wobble){ wobble.t+=dt; if(wobble.t>0.4) wobble=null; } },
    draw(){
      const pulse = 8*Math.sin(performance.now()*0.004);
      ctx.save();
      ctx.shadowColor=targetColor; ctx.shadowBlur=40;
      ctx.fillStyle=targetColor;
      ctx.beginPath(); ctx.arc(W/2,H*0.28,70+pulse,0,Math.PI*2); ctx.fill();
      ctx.restore();
      buttons.forEach((b,i)=>{
        let wob=0;
        if(wobble && wobble.index===i) wob = Math.sin(wobble.t*40)*8;
        ctx.save();
        ctx.translate(b.x+wob,b.y);
        ctx.shadowColor=b.color; ctx.shadowBlur=25;
        ctx.fillStyle=b.color;
        ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
        if(i===selIndex){
          ctx.lineWidth=5; ctx.strokeStyle='#fff'; ctx.globalAlpha=0.85;
          ctx.beginPath(); ctx.arc(0,0,b.r+10,0,Math.PI*2); ctx.stroke();
        }
        ctx.restore();
      });
    },
    onPointerDown(x,y){ buttons.forEach((b,i)=>{ if(dist(x,y,b.x,b.y)<=b.r*1.1) choose(i); }); },
    onArrowPress(dir){
      if(dir==='left') selIndex=(selIndex+buttons.length-1)%buttons.length;
      if(dir==='right') selIndex=(selIndex+1)%buttons.length;
    },
    onCapsLock(){ choose(selIndex); }
  };
}

/* ================== Game 3: Star Catcher ================== */
function createCatcherGame(){
  const target=10; let success=0; let basketX=0; const basketW=200, basketH=50;
  let fallers=[]; let spawnTimer=0; let moveLeft=false, moveRight=false;
  return {
    name:'catch', targetCount:target,
    init(){
      success=0; updateHUD(0,target); basketX=W/2; fallers=[]; spawnTimer=0;
      document.getElementById('catcherControls').style.display='flex';
    },
    cleanup(){ document.getElementById('catcherControls').style.display='none'; },
    update(dt){
      if(moveLeft) basketX -= 420*dt;
      if(moveRight) basketX += 420*dt;
      basketX = clamp(basketX, basketW/2, W-basketW/2);
      spawnTimer -= dt;
      if(spawnTimer<=0){ fallers.push({x:rand(40,W-40), y:-20, vy:rand(140,210), r:26}); spawnTimer=rand(0.7,1.05); }
      fallers.forEach(s=> s.y += s.vy*dt);
      fallers = fallers.filter(s=>{
        const catchY = H*0.82;
        if(s.y > catchY-30 && s.y < catchY+30 && Math.abs(s.x-basketX) < basketW/2+s.r*0.5){
          spawnBurst(s.x,s.y,'#FFC857',18); sfxChime(); success++; updateHUD(success,target);
          if(success>=target) setTimeout(()=>celebrate('catch'),200);
          return false;
        }
        return s.y < H+30;
      });
    },
    draw(){
      ctx.save();
      ctx.shadowColor='#4FD1C5'; ctx.shadowBlur=20; ctx.fillStyle='#4FD1C5';
      roundRect(ctx, basketX-basketW/2, H*0.82-basketH/2, basketW, basketH, 24); ctx.fill();
      ctx.restore();
      fallers.forEach(s=>{
        ctx.save(); ctx.shadowColor='#FFC857'; ctx.shadowBlur=20;
        drawStarShape(ctx, s.x, s.y, s.r, '#FFC857');
        ctx.restore();
      });
    },
    onPointerMove(x){ basketX=x; },
    onPointerDown(x){ basketX=x; },
    onArrowState(dir,down){
      if(dir==='left') moveLeft=down;
      if(dir==='right') moveRight=down;
    }
  };
}

/* ================== Game 4: Pop It (whack-a-tile) ================== */
function cellPos(i){
  const col=i%3, row=Math.floor(i/3);
  const xs=[W*0.22,W*0.5,W*0.78];
  const ys=[H*0.38,H*0.64];
  return { x:xs[col], y:ys[row], r:Math.min(95, W*0.13, H*0.16) };
}
function createGridGame(){
  const target=10; let success=0; const count=6;
  let activeIndex=-1, activeTimer=0;
  function pickNewActive(){
    let idx;
    do{ idx=Math.floor(rand(0,count)); } while(idx===activeIndex && count>1);
    activeIndex=idx; activeTimer=rand(1.8,2.6);
  }
  function pop(){
    const p=cellPos(activeIndex);
    spawnBurst(p.x,p.y,'#9B8CFF',22); sfxChime();
    success++; updateHUD(success,target);
    if(success>=target){ setTimeout(()=>celebrate('grid'),200); return; }
    pickNewActive();
  }
  return {
    name:'grid', targetCount:target,
    init(){ success=0; updateHUD(0,target); pickNewActive(); },
    update(dt){ activeTimer -= dt; if(activeTimer<=0) pickNewActive(); },
    draw(){
      for(let i=0;i<count;i++){
        const p=cellPos(i); const isActive = i===activeIndex;
        ctx.save();
        ctx.shadowColor = isActive? '#9B8CFF' : 'rgba(255,255,255,0.15)';
        ctx.shadowBlur = isActive? 35 : 10;
        ctx.fillStyle = isActive? '#9B8CFF' : 'rgba(255,255,255,0.08)';
        const scale = isActive? 1+0.06*Math.sin(performance.now()*0.01) : 1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*scale,0,Math.PI*2); ctx.fill();
        if(isActive){
          ctx.font = Math.floor(p.r*0.7)+'px sans-serif';
          ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('✨',p.x,p.y+4);
        }
        ctx.restore();
      }
    },
    onPointerDown(x,y){
      for(let i=0;i<count;i++){
        const p=cellPos(i);
        if(dist(x,y,p.x,p.y) <= p.r){ if(i===activeIndex) pop(); else sfxTry(); }
      }
    },
    onCapsLock(){ if(activeIndex>=0) pop(); }
  };
}

/* ================== Game 5: Blast Off (press-to-launch) ================== */
function createRocketGame(){
  const target=16; let power=0; let launching=false; let launchT=0; let rocketY=0; let shake=0;
  function baseY(){ return H*0.72; }
  function push(){
    if(launching) return;
    power++; shake=8;
    spawnBurst(W/2,H*0.5+120,'#FF7A85',10);
    tone(rand(300,340),0.08,'square',0.15);
    updateHUD(Math.min(power,target),target);
    if(power>=target){ launching=true; launchT=0; sfxWhoosh(); spawnBurst(W/2,baseY(),'#7FE0A0',40); }
  }
  return {
    name:'rocket', targetCount:target,
    init(){ power=0; launching=false; launchT=0; rocketY=baseY(); shake=0; updateHUD(0,target); },
    update(dt){
      if(shake>0) shake -= dt*6;
      if(launching){
        launchT += dt;
        rocketY = baseY() - easeIn(launchT/1.2)*(H+200);
        if(launchT>1.3){
          launching=false; power=0; rocketY=baseY(); shake=0; updateHUD(0,target);
          celebrate('rocket');
        }
      }
    },
    draw(){
      const gx=W*0.5-140, gy=H*0.86, gw=280, gh=28;
      ctx.save();
      ctx.fillStyle='rgba(255,255,255,0.12)'; roundRect(ctx,gx,gy,gw,gh,14); ctx.fill();
      ctx.fillStyle='#FFC857'; roundRect(ctx,gx,gy,gw*clamp(power/target,0,1),gh,14); ctx.fill();
      ctx.restore();

      const sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
      ctx.save();
      ctx.translate(W/2+sx, rocketY+sy);
      ctx.font='120px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='#7FE0A0'; ctx.shadowBlur=30;
      ctx.fillText('🚀',0,0);
      ctx.restore();

      if(!launching){
        ctx.save();
        ctx.shadowColor='#FF7A85'; ctx.shadowBlur=30; ctx.fillStyle='#FF7A85';
        ctx.beginPath(); ctx.arc(W/2,H*0.5+120,90,0,Math.PI*2); ctx.fill();
        ctx.font='46px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('👆',W/2,H*0.5+120);
        ctx.restore();
      }
    },
    onPointerDown(){ push(); },
    onCapsLock(){ push(); }
  };
}

/* ================== game registry & flow ================== */
const GAMES = [
  { key:'bubble', label:'Bubbles',  icon:'🫧', color:'#4FD1C5', factory:createBubbleGame },
  { key:'match',  label:'Match It', icon:'🎨', color:'#FF7A85', factory:createMatchGame },
  { key:'catch',  label:'Catch',    icon:'🌠', color:'#FFC857', factory:createCatcherGame },
  { key:'grid',   label:'Pop It',   icon:'✨', color:'#9B8CFF', factory:createGridGame },
  { key:'rocket', label:'Blast Off',icon:'🚀', color:'#7FE0A0', factory:createRocketGame }
];
const visitedSet = new Set();
let currentGame = null;
let homeSelIndex = 0;

const homeScreen = document.getElementById('homeScreen');
const homeGrid = document.getElementById('homeGrid');
const finaleBtn = document.getElementById('finaleBtn');
const celebrateOverlay = document.getElementById('celebrateOverlay');
const celebrateEmoji = document.getElementById('celebrateEmoji');
const finaleOverlay = document.getElementById('finaleOverlay');

function renderHome(){
  homeGrid.innerHTML='';
  GAMES.forEach((g,i)=>{
    const btn = document.createElement('button');
    btn.className = 'gameTile' + (i===homeSelIndex? ' selected':'');
    btn.style.setProperty('--tile-color', g.color);
    btn.innerHTML = '<span class="tileIcon">'+g.icon+'</span><span class="tileLabel">'+g.label+'</span>'
      + (visitedSet.has(g.key) ? '<span class="badge">✓</span>' : '');
    btn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); ensureAudio(); homeSelIndex=i; startGame(g); });
    homeGrid.appendChild(btn);
  });
  finaleBtn.style.display = visitedSet.size >= GAMES.length ? 'inline-flex' : 'none';
}

function showScreen(which){
  document.body.classList.toggle('in-game', which==='game');
  homeScreen.style.display = which==='home' ? 'flex' : 'none';
}

function startGame(gameDef){
  if(currentGame && currentGame.cleanup) currentGame.cleanup();
  currentGame = gameDef.factory();
  currentGame.init();
  showScreen('game');
}

function goHome(){
  if(currentGame && currentGame.cleanup) currentGame.cleanup();
  currentGame = null;
  showScreen('home');
  renderHome();
}

function celebrate(gameKey){
  visitedSet.add(gameKey);
  spawnConfetti(140);
  sfxFanfare();
  celebrateEmoji.textContent = pick(['🎉','🌟','🎊','🥳']);
  celebrateOverlay.classList.add('show');
  celebrateEmoji.classList.remove('bounce'); void celebrateEmoji.offsetWidth; celebrateEmoji.classList.add('bounce');
}

document.getElementById('playAgainBtn').addEventListener('pointerdown', (e)=>{
  e.preventDefault();
  celebrateOverlay.classList.remove('show');
  const g = GAMES.find(g=>g.key === (currentGame && currentGame.name));
  if(g) startGame(g); else goHome();
});
document.getElementById('celHomeBtn').addEventListener('pointerdown', (e)=>{
  e.preventDefault();
  celebrateOverlay.classList.remove('show');
  goHome();
});

document.getElementById('finaleBtn').addEventListener('pointerdown', (e)=>{
  e.preventDefault(); ensureAudio();
  spawnConfetti(280); sfxFanfare();
  finaleOverlay.classList.add('show');
  const fe = document.getElementById('finaleEmoji');
  fe.classList.remove('bounce'); void fe.offsetWidth; fe.classList.add('bounce');
});
document.getElementById('finaleMoreBtn').addEventListener('pointerdown', (e)=>{
  e.preventDefault(); finaleOverlay.classList.remove('show');
});
document.getElementById('finaleNewBtn').addEventListener('pointerdown', (e)=>{
  e.preventDefault(); finaleOverlay.classList.remove('show'); visitedSet.clear(); renderHome();
});

document.getElementById('resetBtn').addEventListener('pointerdown', (e)=>{
  e.preventDefault(); visitedSet.clear(); renderHome();
});

document.getElementById('homeBtnTop').addEventListener('pointerdown', (e)=>{
  e.preventDefault(); goHome();
});

/* catch-game on-screen arrow buttons */
function wireHoldButton(el,dir){
  const setState=(down)=>{ if(currentGame && currentGame.onArrowState) currentGame.onArrowState(dir,down); };
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); setState(true); });
  el.addEventListener('pointerup', ()=> setState(false));
  el.addEventListener('pointerleave', ()=> setState(false));
  el.addEventListener('pointercancel', ()=> setState(false));
}
wireHoldButton(document.getElementById('leftBtn'),'left');
wireHoldButton(document.getElementById('rightBtn'),'right');

/* ================== input wiring ================== */
canvas.addEventListener('contextmenu', e=> e.preventDefault());
canvas.addEventListener('pointerdown', e=>{
  ensureAudio();
  const rect = canvas.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  if(currentGame && currentGame.onPointerDown) currentGame.onPointerDown(x,y);
});
canvas.addEventListener('pointermove', e=>{
  if(!currentGame || !currentGame.onPointerMove) return;
  const rect = canvas.getBoundingClientRect();
  currentGame.onPointerMove(e.clientX-rect.left, e.clientY-rect.top);
});

window.addEventListener('keydown', e=>{
  if(e.code==='CapsLock'){
    if(celebrateOverlay.classList.contains('show')){ document.getElementById('playAgainBtn').click(); return; }
    if(finaleOverlay.classList.contains('show')){ document.getElementById('finaleMoreBtn').click(); return; }
    if(!document.body.classList.contains('in-game')){
      const g = GAMES[homeSelIndex]; ensureAudio(); if(g) startGame(g); return;
    }
    if(currentGame && currentGame.onCapsLock) currentGame.onCapsLock();
    return;
  }
  if(e.key==='ArrowLeft' || e.key==='ArrowRight' || e.key==='ArrowUp' || e.key==='ArrowDown'){
    e.preventDefault();
    const dir = e.key.replace('Arrow','').toLowerCase();
    if(!document.body.classList.contains('in-game')){
      if(dir==='left') homeSelIndex=(homeSelIndex+GAMES.length-1)%GAMES.length;
      if(dir==='right') homeSelIndex=(homeSelIndex+1)%GAMES.length;
      renderHome();
      return;
    }
    if(currentGame){
      if(!e.repeat && currentGame.onArrowPress) currentGame.onArrowPress(dir);
      if(currentGame.onArrowState) currentGame.onArrowState(dir,true);
    }
  }
});
window.addEventListener('keyup', e=>{
  if(e.key && e.key.indexOf('Arrow')===0 && currentGame && currentGame.onArrowState){
    currentGame.onArrowState(e.key.replace('Arrow','').toLowerCase(), false);
  }
});

/* ================== main loop ================== */
let lastT = performance.now();
function loop(now){
  const dt = Math.min((now-lastT)/1000, 0.05);
  lastT = now;
  drawBackground(now);
  if(currentGame){ currentGame.update(dt); currentGame.draw(); }
  updateParticles(dt);
  drawParticles();
  requestAnimationFrame(loop);
}

/* ================== boot ================== */
resize();
renderHome();
showScreen('home');
requestAnimationFrame(loop);
</script>
