<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Who I Live With</title>
    <style>
        /* --- Accessibility Fonts & Root Styling --- */
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&family=Open+Dyslexic&family=Comic+Neue:wght@700&display=swap');

        :root {
            --primary-bg: #F9F4F5;
            --card-active-border: #FFD166;
            --accent-color: #06D6A0;
            --text-color: #2B2D42;
            --card-bg: #FFFFFF;
            --font-family: 'Lexend', sans-serif;
            --animation-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        /* --- Header & Student Name Input --- */
        .app-container {
            width: 100%;
            max-width: 900px;
            background: #FFFFFF;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            border: 4px solid #E2E8F0;
        }

        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 3px dashed #E2E8F0;
            padding-bottom: 20px;
        }

        .name-input-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }

        .name-input {
            width: 100%;
            padding: 15px;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            border: 4px solid #118AB2;
            border-radius: 16px;
            font-family: inherit;
            background: #EBF8FF;
            color: #073B4C;
        }

        .name-input::placeholder {
            color: #A0AEC0;
        }

        /* --- Customization Control Panel --- */
        .controls-panel {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .control-group label {
            font-size: 14px;
            font-weight: bold;
            color: #64748B;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .control-btn {
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #CBD5E1;
            background: #FFFFFF;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .control-btn.active {
            background-color: #118AB2;
            color: white;
            border-color: #118AB2;
        }

        /* --- Statement Bar (Supporting Symbols) --- */
        .statement-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background-color: #FFD166;
            border: 4px solid #F7B801;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 30px;
        }

        .statement-text {
            font-size: 36px;
            font-weight: bold;
            color: #073B4C;
        }

        .statement-symbol {
            font-size: 48px;
        }

        /* --- Choice Grid (The 20 Cards) --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .choice-card {
            background: var(--card-bg);
            border: 4px solid #CBD5E1;
            border-radius: 18px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform var(--animation-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s ease, background-color 0.2s ease;
            position: relative;
        }

        .choice-card:hover {
            transform: scale(1.03);
        }

        .choice-card.selected {
            border-color: #06D6A0;
            background-color: #E8FDF5;
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(6, 214, 160, 0.15);
        }

        /* High-contrast selected checkmark symbol */
        .choice-card.selected::after {
            content: "⭐";
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 24px;
        }

        .bounce-mode .choice-card.selected {
            animation: cardBounce 0.6s ease;
        }

        .symbol {
            font-size: 64px;
            margin-bottom: 10px;
        }

        .card-label {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            word-wrap: break-word;
        }

        /* --- Footer & Submit Actions --- */
        .submit-section {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .done-btn {
            font-size: 32px;
            padding: 20px 50px;
            background-color: #06D6A0;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 10px 20px rgba(6, 214, 160, 0.3);
            transition: transform 0.2s ease, background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .done-btn:hover {
            transform: translateY(-4px) scale(1.02);
            background-color: #05C08F;
        }

        /* --- Celebration Summary Page --- */
        .summary-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 30px;
            overflow-y: auto;
        }

        .celebrate-title {
            font-size: 48px;
            color: #118AB2;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .celebration-mascot {
            font-size: 100px;
            margin-bottom: 20px;
            animation: mascotWiggle 1.5s infinite alternate ease-in-out;
        }

        .summary-title-card {
            font-size: 36px;
            font-weight: bold;
            background: #FFD166;
            color: #073B4C;
            padding: 15px 35px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .summary-favorites-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 800px;
            margin-bottom: 40px;
        }

        .summary-card {
            background: white;
            border: 4px solid #06D6A0;
            border-radius: 16px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(6, 214, 160, 0.1);
        }

        .reset-btn {
            font-size: 22px;
            padding: 15px 30px;
            background-color: #EF476F;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
        }

        /* --- Keyframe Animations --- */
        @keyframes cardBounce {
            0% { transform: scale(1); }
            30% { transform: scale(1.15) rotate(2deg); }
            50% { transform: scale(0.95) rotate(-2deg); }
            100% { transform: scale(1.05) rotate(0deg); }
        }

        @keyframes mascotWiggle {
            0% { transform: translateY(0) rotate(-10deg); }
            100% { transform: translateY(-15px) rotate(10deg); }
        }

        /* --- Theme Styling Alternatives --- */
        body.dark-contrast {
            background-color: #121212;
            color: #FFFFFF;
        }
        body.dark-contrast .app-container {
            background-color: #1E1E1E;
            border-color: #333333;
        }
        body.dark-contrast .choice-card {
            background-color: #2D2D2D;
            border-color: #444444;
            color: #FFFFFF;
        }
        body.dark-contrast .controls-panel {
            background-color: #2D2D2D;
            border-color: #444444;
        }
        body.dark-contrast .name-input {
            background-color: #1A365D;
            color: #E2E8F0;
            border-color: #3182CE;
        }

        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #f00;
            opacity: 0.8;
            pointer-events: none;
        }
    </style>
</head>
<body class="bounce-mode">

    <div class="app-container">
        
        <!-- Top Section: Student Name & Customization Controls -->
        <header class="header-section">
            <div class="name-input-container">
                <input type="text" id="studentName" class="name-input" placeholder="✨ Type Student Name Here ✨" aria-label="Student Name">
            </div>

            <!-- Customizer Controls -->
            <div class="controls-panel">
                <div class="control-group">
                    <label>Font / Text</label>
                    <div class="btn-group">
                        <button class="control-btn active" onclick="setFont('Lexend', this)">Lexend</button>
                        <button class="control-btn" onclick="setFont('Comic Neue', this)">Comic</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Screen Brightness</label>
                    <div class="btn-group">
                        <button class="control-btn active" onclick="setContrast('light', this)">Light</button>
                        <button class="control-btn" onclick="setContrast('dark', this)">High Contrast</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Bouncy Buttons</label>
                    <div class="btn-group">
                        <button class="control-btn active" onclick="setAnimation('bounce', this)">Yes 🎉</button>
                        <button class="control-btn" onclick="setAnimation('calm', this)">Calm 🌸</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Visual Choice Target -->
        <main>
            <div class="statement-bar">
                <span class="statement-symbol">🏠</span>
                <span class="statement-text">I LIVE WITH:</span>
            </div>

            <!-- Grid of 20 Home & Family Choice Cards -->
            <div class="grid-container" id="cardsGrid">
                <!-- Javascript renders the family choices here -->
            </div>

            <div class="submit-section">
                <button class="done-btn" onclick="showCelebration()">
                    <span>Done</span> <span>🎉</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Screen Overlay for Celebration and Recap -->
    <div class="summary-overlay" id="celebrationScreen">
        <div class="celebration-mascot" id="mascot">🏠</div>
        <div class="celebrate-title">All Done! Great Job!</div>
        <div class="summary-title-card" id="summaryHeader">Who [Name] Lives With:</div>
        
        <div class="summary-favorites-grid" id="favoritesContainer">
            <!-- Selected choices pop up here -->
        </div>

        <button class="reset-btn" onclick="resetApp()">Start Again 🔄</button>
    </div>

    <script>
        // List of 20 clear home environment & family visual choices
        const choices = [
            { id: "mom", label: "Mom", emoji: "👩" },
            { id: "dad", label: "Dad", emoji: "👨" },
            { id: "brother", label: "Brother", emoji: "👦" },
            { id: "sister", label: "Sister", emoji: "👧" },
            { id: "baby", label: "Baby", emoji: "👶" },
            { id: "grandma", label: "Grandma", emoji: "👵" },
            { id: "grandpa", label: "Grandpa", emoji: "👴" },
            { id: "stepmom", label: "Step Mom", emoji: "👩" },
            { id: "stepdad", label: "Step Dad", emoji: "👨" },
            { id: "fosterparent", label: "Foster Parent", emoji: "🧑" },
            { id: "caregiver", label: "Caregiver", emoji: "🧑‍⚕️" },
            { id: "roommate", label: "Housemate", emoji: "🧑‍🤝‍🧑" },
            { id: "dog", label: "Dog", emoji: "🐶" },
            { id: "cat", label: "Cat", emoji: "🐱" },
            { id: "fish", label: "Fish", emoji: "🐠" },
            { id: "bird", label: "Bird", emoji: "🐦" },
            { id: "bunny", label: "Rabbit", emoji: "🐰" },
            { id: "house", label: "House", emoji: "🏡" },
            { id: "apartment", label: "Apartment", emoji: "🏢" },
            { id: "twohomes", label: "Two Homes", emoji: "🏠↔️🏠" }
        ];

        const selectedIds = new Set();

        // Synthesized audio context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, duration, type = "sine") {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // Render the Grid
        const grid = document.getElementById('cardsGrid');
        choices.forEach(item => {
            const card = document.createElement('div');
            card.className = 'choice-card';
            card.id = `card-${item.id}`;
            card.setAttribute('role', 'button');
            card.setAttribute('tabindex', '0');
            card.innerHTML = `
                <div class="symbol">${item.emoji}</div>
                <div class="card-label">${item.label}</div>
            `;
            
            card.addEventListener('click', () => toggleCard(item.id));
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    toggleCard(item.id);
                }
            });
            grid.appendChild(card);
        });

        function toggleCard(id) {
            const card = document.getElementById(`card-${id}`);
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
                card.classList.remove('selected');
                playTone(250, 0.1, "triangle");
            } else {
                selectedIds.add(id);
                card.classList.add('selected');
                playTone(440, 0.15, "sine");
            }
        }

        // --- Layout Customizers ---
        function setFont(fontName, element) {
            document.body.style.setProperty('--font-family', `'${fontName}', sans-serif`);
            updateActiveButton(element);
        }

        function setContrast(theme, element) {
            if (theme === 'dark') {
                document.body.classList.add('dark-contrast');
            } else {
                document.body.classList.remove('dark-contrast');
            }
            updateActiveButton(element);
        }

        function setAnimation(mode, element) {
            if (mode === 'bounce') {
                document.body.classList.add('bounce-mode');
                document.body.style.setProperty('--animation-speed', '0.3s');
            } else {
                document.body.classList.remove('bounce-mode');
                document.body.style.setProperty('--animation-speed', '0s');
            }
            updateActiveButton(element);
        }

        function updateActiveButton(activeBtn) {
            const siblingButtons = activeBtn.parentNode.querySelectorAll('.control-btn');
            siblingButtons.forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        // --- Celebration Effect ---
        function createConfetti() {
            const container = document.getElementById('celebrationScreen');
            const colors = ['#FFD166', '#06D6A0', '#118AB2', '#EF476F', '#FF8A5B'];
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = Math.random() * 100 + 'vh';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 1.5})`;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0px';
                container.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        function showCelebration() {
            const inputName = document.getElementById('studentName').value.trim();
            const displayName = inputName ? inputName : "Our Friend";
            
            document.getElementById('summaryHeader').innerText = `✨ Who ${displayName} Lives With: ✨`;
            
            const favContainer = document.getElementById('favoritesContainer');
            favContainer.innerHTML = '';

            if (selectedIds.size === 0) {
                favContainer.innerHTML = '<div style="font-size:24px; text-align:center;">Everyone at home! 🏡</div>';
            } else {
                choices.forEach(item => {
                    if (selectedIds.has(item.id)) {
                        const favCard = document.createElement('div');
                        favCard.className = 'summary-card';
                        favCard.innerHTML = `<span>${item.emoji}</span> <span>${item.label}</span>`;
                        favContainer.appendChild(favCard);
                    }
                });
            }

            setTimeout(() => playTone(300, 0.2), 0);
            setTimeout(() => playTone(400, 0.2), 150);
            setTimeout(() => playTone(500, 0.2), 300);
            setTimeout(() => playTone(600, 0.4), 450);

            const overlay = document.getElementById('celebrationScreen');
            overlay.style.display = 'flex';
            createConfetti();
        }

        function resetApp() {
            selectedIds.clear();
            const cards = document.querySelectorAll('.choice-card');
            cards.forEach(card => card.classList.remove('selected'));
            document.getElementById('studentName').value = '';
            document.getElementById('celebrationScreen').style.display = 'none';
        }
    </script>
</body>
</html>
